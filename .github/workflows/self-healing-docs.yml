name: Self-Healing Documentation CI

on:
  pull_request:
    paths:
      - 'gateway/**.py'
      - 'gateway/API_REFERENCE.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  doc-sync-check:
    name: AST Documentation Synchronization Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Self-Healing Docs Verifier
        id: doc_check
        run: python3 gateway/check_docs_drift.py

      - name: Open correction PR if drift was healed
        if: steps.doc_check.outputs.drift_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs(gateway): auto-heal API_REFERENCE.md signature drift"
          title: "docs(gateway): auto-heal API_REFERENCE.md signature drift"
          body: |
            Opened automatically by the Self-Healing Documentation CI check (Project 4).

            A function signature in `gateway/main.py` no longer matches its entry in
            `gateway/API_REFERENCE.md`. See the job summary on the triggering PR for
            the specific drift items and diff. This branch contains the auto-corrected
            `API_REFERENCE.md`.
          branch: auto/self-healing-docs
          add-paths: gateway/API_REFERENCE.md
